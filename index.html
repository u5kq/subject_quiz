const all=()=>base.concat(musicBank);
let custom=JSON.parse(localStorage.getItem("副教科_custom")||"[]");
let progress=JSON.parse(localStorage.getItem("副教科_progress")||"{}");
let weak=JSON.parse(localStorage.getItem("副教科_weak")||"[]");
let currentSubject="",currentTopic=null,queue=[],idx=0,mode="mix",answered=false;
let currentOptions=[],currentCorrect="",currentTF=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const js=s=>JSON.stringify(s);
const key=q=>q[0]+"|"+q[1]+"|"+q[2];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function save(){localStorage.setItem("副教科_progress",JSON.stringify(progress));localStorage.setItem("副教科_weak",JSON.stringify(weak));}
function show(id){["home","detail","study"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo({top:0,behavior:"smooth"});}
function goHome(){show("home");}
function renderHome(){$("subjects").innerHTML=subjects.map(s=>'<button class="subject" onclick="openSubject('+js(s.name)+')"><div class="ico">'+s.emoji+'</div><h3>'+esc(s.name)+'</h3><p>'+esc(s.desc)+'</p><div class="count">'+all().filter(q=>q[0]===s.name).length+' 問収録　→</div></button>').join("");}
function openSubject(name){
 currentSubject=name;currentTopic=null;const s=subjects.find(x=>x.name===name),items=all().filter(q=>q[0]===name);
 $("detailTitle").textContent=name;$("detailDesc").textContent=s.desc+" ・ "+items.length+"問";
 const done=items.filter(q=>(progress[key(q)]?.correct||0)>0).length;
 $("subjectProgress").style.width=(items.length?done/items.length*100:0)+"%";
 const modes=[["mix","ランダム総合","形式を混ぜて出題",true],["mc","4択問題","選択肢から選ぶ"],["tf","○×問題","正しいか判定"],["fill","穴埋め問題","答えを入力"],["flash","一問一答","答えを見て確認"],["weak","苦手を復習","間違えた問題を集中特訓"]];
 $("modeGrid").innerHTML=modes.map((m,i)=>'<button class="mode-card '+(i===0?'primary':'')+'" onclick="launch('+js(name)+',null,'+js(m[0])+')"><b>'+m[1]+'</b><small>'+m[2]+'</small></button>').join("");
 $("topicList").innerHTML=s.topics.map(t=>{const n=items.filter(q=>q[1]===t).length;return '<div class="topic"><div><b>'+esc(t)+'</b><small>'+n+'問</small></div><div class="topic-actions"><button class="btn soft" onclick="launch('+js(name)+','+js(t)+',\'flash\')">一問一答</button><button class="btn primary" onclick="launch('+js(name)+','+js(t)+',\'mix\')">出題する →</button></div></div>';}).join("");
 show("detail");
}
function backToDetail(){openSubject(currentSubject);}
function launch(sub,topic,kind){
 currentSubject=sub;currentTopic=topic;mode=kind;
 let items=all().filter(q=>(!sub||q[0]===sub)&&(!topic||q[1]===topic));
 if(kind==="weak")items=all().filter(q=>weak.includes(key(q))&&(!sub||q[0]===sub));
 if(!items.length){alert(kind==="weak"?"この教科には苦手登録した問題がありません。":"この単元には問題がまだありません。");return;}
 queue=shuffle(items);
 if(kind==="mix")queue=queue.slice(0,Math.min(15,queue.length));
 idx=0;show("study");renderStudy();
}
function renderStudy(){
 const body=$("studyBody"),tools=$("studyTools");
 if(idx>=queue.length){$("studyMode").textContent="COMPLETED";$("studyCount").textContent=queue.length+"問 完了";$("studyProgress").style.width="100%";$("prompt").textContent="おつかれさま！";$("studySub").textContent="";body.innerHTML='<div class="answer">最後まで取り組めました。<br>間違えた問題は「苦手を復習」から解き直せます。</div>';tools.innerHTML='<button class="btn primary" onclick="backToDetail()">もう一度学習する</button><button class="btn" onclick="goHome()">教科一覧へ</button>';return;}
 const q=queue[idx];answered=false;currentOptions=[];
 $("studyMode").textContent=({mix:"RANDOM MIX",mc:"4 CHOICE",tf:"TRUE / FALSE",fill:"FILL IN",flash:"QUICK CHECK",weak:"WEAK REVIEW"})[mode]||"PRACTICE";
 $("studyCount").textContent=(idx+1)+" / "+queue.length;
 $("studyProgress").style.width=(idx/queue.length*100)+"%";
 $("prompt").textContent=q[2];$("studySub").textContent=q[0]+"　/　"+q[1];
 tools.innerHTML='<button class="btn soft" onclick="markWeak()">☆ 苦手に登録</button>';
 let actual=mode;
 if(mode==="mix")actual=shuffle(["mc","tf","fill","flash"])[0];
 if(actual==="flash"){body.innerHTML='<div id="flashAnswer" class="answer hidden"></div><button class="btn primary" onclick="reveal()">答えを見る</button>';tools.insertAdjacentHTML("beforeend",'<button class="btn" onclick="next()">次の問題 →</button>');return;}
 if(actual==="mc"){
  const other=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3])).slice(0,3).map(x=>x[3]);
  currentOptions=shuffle([q[3],...other]);
  const fillers=["上記のどれでもない","該当しない","正しいものはない"];
  while(currentOptions.length<4)currentOptions.push(fillers[currentOptions.length-1]);
  currentOptions=currentOptions.slice(0,4);currentCorrect=q[3];
  body.innerHTML='<div class="choices">'+currentOptions.map((o,i)=>'<button class="choice" onclick="answerChoice('+i+')">'+["A","B","C","D"][i]+'　'+esc(o)+'</button>').join("")+'</div><div id="feedback"></div>';
 }else if(actual==="tf"){
  const falseChoice=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]))[0];
  currentTF=Math.random()<.5;
  const statement=currentTF?q[3]:(falseChoice?falseChoice[3]:"この説明は正しい");
  if(!falseChoice)currentTF=true;
  body.innerHTML='<div class="answer">次の説明は正しい？<br><b>'+esc(statement)+'</b></div><div class="choices"><button class="choice" onclick="answerTF(true)">○　正しい</button><button class="choice" onclick="answerTF(false)">×　ちがう</button></div><div id="feedback"></div>';
 }else{
  body.innerHTML='<p class="muted">答えのキーワードを入力してください。</p><input id="fillInput" class="input-answer" placeholder="ここに入力" autocomplete="off"><button class="btn primary" onclick="checkFill()">答え合わせ</button><div id="feedback"></div>';
  $("fillInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkFill();});
 }
 tools.insertAdjacentHTML("beforeend",'<button class="btn" id="nextBtn" disabled onclick="next()">次の問題 →</button>');
}
function reveal(){const a=$("flashAnswer");a.textContent=queue[idx][3];a.classList.remove("hidden");}
function record(ok){const q=queue[idx],k=key(q),p=progress[k]||{tries:0,correct:0};p.tries++;if(ok)p.correct++;progress[k]=p;if(!ok&&!weak.includes(k))weak.push(k);save();const el=$("feedback");if(el)el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'正解！':'不正解。答えを確認しよう。')+'<br><b>正解：</b>'+esc(q[3])+'</div>';const n=$("nextBtn");if(n)n.disabled=false;}
function answerChoice(i){if(answered)return;answered=true;const ok=currentOptions[i]===currentCorrect;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(currentOptions[j]===currentCorrect)b.classList.add("correct");});if(!ok)document.querySelectorAll(".choice")[i].classList.add("wrong");record(ok);}
function answerTF(v){if(answered)return;answered=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);record(v===currentTF);}
function checkFill(){if(answered)return;const v=($("fillInput").value||"").replace(/[\s　。、,.]/g,"").toLowerCase();if(!v){alert("答えを入力してください。");return;}answered=true;const a=queue[idx][3].replace(/[\s　。、,.]/g,"").toLowerCase();record(a.includes(v)||v.includes(a));}
function markWeak(){const k=key(queue[idx]);if(!weak.includes(k)){weak.push(k);save();}const b=document.querySelector(".study-actions .soft");if(b)b.textContent="✓ 登録済み";}
function next(){idx++;renderStudy();}
renderHome();
</script></body></html>
