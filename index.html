<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>副教科対策</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#fffaf0;--paper:#fff;--ink:#292719;--muted:#777363;--line:#eee5cc;--yellow:#f5d45e;--yellow-deep:#d5a91e;--dark:#65500f;--pale:#fff4c9;--mint:#eaf5eb;--blue:#edf3ff;--pink:#fff0ed;--shadow:0 8px 24px rgba(78,62,15,.07)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 90% 6%,#fff1bd 0,transparent 25%),var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.7;letter-spacing:.015em;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:700px;margin:auto;padding:0 18px 42px}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#ffe88e 0%,#fff0bd 58%,#fff8df 100%);padding:28px 22px 32px;margin:0 -18px 25px;border:0;border-radius:0 0 28px 28px;box-shadow:0 7px 24px rgba(125,95,18,.08)}
header:after{content:"";position:absolute;width:155px;height:155px;border-radius:50%;right:-34px;top:-57px;background:rgba(255,255,255,.28)}
.brand{position:relative;z-index:1;display:flex;align-items:center;font-size:10px;letter-spacing:.19em;font-weight:900;color:#715811}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:11px;background:#fffdf5;color:#73570e;margin-right:9px;font-size:14px;box-shadow:0 3px 8px #8b6a1b18}
header h1{position:relative;z-index:1;font-size:clamp(29px,7vw,36px);font-weight:900;letter-spacing:.045em;line-height:1.25;margin:15px 0 5px}
header p{position:relative;z-index:1;margin:0;color:#79652b;font-size:12px;font-weight:600;letter-spacing:.04em}
.hidden{display:none!important}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 1px 14px}
.section-head h2,.section-head h3{font-size:18px;font-weight:900;letter-spacing:.04em;margin:0}
.section-head small,.card-label{font-size:10px;font-weight:900;letter-spacing:.16em;color:#9a791b}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subject{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px 15px;text-align:left;min-height:145px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.subject:active,.topic:active,.mode-card:active{transform:scale(.985)}
.subject .emoji{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--pale);font-size:22px}
.subject:nth-child(2) .emoji{background:var(--mint)}.subject:nth-child(3) .emoji{background:var(--blue)}.subject:nth-child(4) .emoji{background:#f5edff}.subject:nth-child(5) .emoji{background:#ffefeb}
.subject h3{font-size:16px;font-weight:900;letter-spacing:.035em;margin:11px 0 2px}
.subject p{font-size:11px;font-weight:500;color:var(--muted);margin:0}
.subject .count{font-size:11px;color:#8a6a13;font-weight:800;margin-top:9px}
.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:23px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}
.back{border:1px solid #f0dfaa;background:#fff7d9;color:#765d17;font-weight:800;font-size:12px;padding:10px 14px;border-radius:12px;margin:0 0 13px}
#detailTitle{font-size:26px;font-weight:900;letter-spacing:.04em;margin:5px 0}
.muted{font-size:13px;color:var(--muted);line-height:1.8;font-weight:500}
.progress{height:8px;background:#f1eee4;border-radius:99px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#f3ce4f,#f8df83);width:0;border-radius:99px;transition:width .25s}
.topic-list{display:grid;gap:10px;margin-top:13px}
.topic{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--ink);box-shadow:0 3px 12px rgba(78,62,15,.035)}
.topic b{font-size:14px;font-weight:800}.topic span{font-size:11px;color:var(--muted);display:block;margin-top:3px}.topic .arrow{font-size:23px;color:#b28b1e}
.mode-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:15px 0}
.mode-card{width:100%;display:grid;grid-template-columns:48px 1fr 18px;align-items:center;gap:12px;text-align:left;min-height:83px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 14px rgba(78,62,15,.045);color:var(--ink)}
.mode-card.mode-featured{background:linear-gradient(110deg,#fff5cf,#fffdf5);border-color:#e9d27e}
.mode-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#fff0b6;color:#72580f;font-size:20px;font-weight:900}
.mode-card:nth-child(2) .mode-icon{background:#eaf3ff;color:#46658e}.mode-card:nth-child(3) .mode-icon{background:#eaf5eb;color:#46744d}.mode-card:nth-child(4) .mode-icon{background:#f5edff;color:#74589a}.mode-card:nth-child(5) .mode-icon{background:#fff0eb;color:#9a6254}.mode-card:nth-child(6) .mode-icon{background:#edf1f8;color:#596a85}
.mode-copy b{display:block;font-size:15px;font-weight:900;letter-spacing:.02em}.mode-copy small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}.mode-copy em{display:block;font-style:normal;font-size:10px;font-weight:800;color:#9a791b;margin-top:4px}.mode-arrow{font-size:22px;color:#b28b1e}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 15px;border-radius:13px;min-height:48px;font-size:13px;font-weight:800}
.btn.primary{background:var(--yellow);border-color:#e8c64e;color:#4d3a08}.btn.soft{background:var(--pale);border-color:#f1e2b4;color:var(--dark)}
.question{font-size:clamp(21px,5vw,27px);font-weight:900;letter-spacing:.015em;line-height:1.55;margin:20px 0;overflow-wrap:anywhere}
.answer{background:#fff7d8;border:1px solid #f1dfa0;border-radius:16px;padding:16px;margin:14px 0;white-space:pre-wrap;line-height:1.9;font-size:15px;font-weight:600}
.choices{display:grid;gap:10px}.choice{width:100%;border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;text-align:left;min-height:56px;font-size:14px;font-weight:600;line-height:1.65}
.choice:disabled{cursor:default}.choice.correct{background:var(--mint);border-color:#91c5a0}.choice.wrong{background:var(--pink);border-color:#e2a49a}
.feedback{padding:14px;border-radius:14px;margin-top:13px;font-size:13px;font-weight:600}.feedback.good{background:var(--mint);color:#28633b}.feedback.bad{background:var(--pink);color:#8d3c32}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0 13px;background:#fff}
button:focus-visible,input:focus-visible{outline:3px solid #e4bd43;outline-offset:3px}
@media(min-width:600px){.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:370px){.app{padding:0 13px 32px}header{margin:0 -13px 20px;padding:24px 17px 28px}.panel{padding:16px}.subject{padding:14px;min-height:138px}}
</style>
<style id="readability">
:root{--bg:#fffdf7;--ink:#242319;--muted:#505148;--line:#ded8c4;--yellow:#f3c943;--dark:#604800;--pale:#fff1b8;--mint:#e4f2e5;--blue:#e8efff;--pink:#ffebe7}
body{font-size:16px;color:var(--ink);line-height:1.7}.app{max-width:720px;padding:0 18px 40px}
header{padding:27px 22px 32px}header h1{font-size:30px;font-weight:850}header p{font-size:14px;color:#5b4b20}
.section-head h2,.section-head h3{font-size:19px}.section-head small,.card-label{font-size:11px;color:#5e4700}
.subjects{gap:13px}.subject{min-height:140px;padding:17px;border-color:#d9d1b8;border-radius:18px;box-shadow:0 3px 10px #32280d0c}
.subject .emoji{width:46px;height:46px;font-size:23px}.subject h3{font-size:17px;margin-top:11px}.subject p{font-size:13px;color:#505148}.subject .count{font-size:12px;color:#604800}
.panel{border-color:#d9d1b8;border-radius:20px;padding:20px}.back{font-size:14px;padding:11px 14px;background:#ffedaa;color:#4c3900}
#detailTitle{font-size:25px}.muted{font-size:14px;color:#505148}.topic-list{gap:11px}
.topic{min-height:66px;padding:15px 16px;border-color:#d9d1b8;border-radius:14px}.topic b{font-size:15px;color:#26251d}.topic span{font-size:13px;color:#505148}.topic .arrow{font-size:22px;color:#705400}
.mode-grid{gap:11px}.btn{font-size:14px;min-height:52px;padding:13px 15px;border-color:#d9d1b8}.mode-card{min-height:78px}.mode-card b{font-size:15px}.mode-card small{font-size:12px;color:#505148}
.btn.primary{background:#f3c943;border-color:#d6ae2f;color:#302400}.btn.soft{background:#ffedaa;border-color:#e5cf7b;color:#4c3900}
.question{font-size:clamp(23px,5.5vw,29px);line-height:1.55;color:#222117;margin:22px 0}
.choice{font-size:16px;line-height:1.65;min-height:60px;padding:15px 16px;border-color:#d6d0be;border-radius:14px;color:#29281f}
.choice.correct{background:#e2f2e5;border:2px solid #559a68;color:#174a26}.choice.wrong{background:#ffebe7;border:2px solid #c66a5e;color:#702b24}
.answer{font-size:15px;line-height:1.8;background:#fff2bd;border-color:#e5cc70;color:#302800}.feedback{font-size:15px;line-height:1.7;padding:14px}
.field{font-size:16px;min-height:54px;border-color:#c9c2ae}.toolbar .btn{min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid #8b6900;outline-offset:3px}
@media(max-width:390px){.app{padding:0 14px 36px}header{margin:0 -14px 18px;padding:23px 17px 27px}header h1{font-size:27px}.subject{padding:14px;min-height:133px}.panel{padding:16px}.choice{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="brand-mark">Q</span>STUDY / QUIZ</div><h1>副教科対策</h1><p>中学3年・定期テスト対策</p></header>
<main id="home"><div class="section-head"><h2>教科を選択</h2><small>STEP 1</small></div><div class="subjects" id="subjects"></div></main>
<section id="detail" class="hidden"><button class="back" onclick="goHome()">← 教科選択に戻る</button><div class="panel"><div class="card-label">STEP 2 / UNIT</div><h2 id="detailTitle"></h2><p class="muted" id="detailDesc"></p><div class="progress"><i id="subjectProgress"></i></div><div class="section-head"><h3>単元を選択</h3></div><div class="topic-list" id="topicList"></div><div id="formatStage" class="hidden"><button class="back" onclick="backToTopics()">← 単元選択に戻る</button><div class="section-head"><h3 id="selectedTopicTitle"></h3><small>STEP 3 / FORMAT</small></div><p class="muted">問題形式を選んでスタート。</p><div class="mode-grid" id="modeGrid"></div></div></div></section>
<section id="study" class="hidden"><button class="back" onclick="backToDetail()">← 戻る</button><div class="panel"><div class="card-label" id="studyMode">PRACTICE</div><div class="muted" id="studyCount"></div><div class="progress"><i id="studyProgress"></i></div><div class="question" id="prompt"></div><div id="studyBody"></div><div class="toolbar" id="studyTools"></div></div></section>
</div>
<script>

const subjects=[
 {name:"保健体育",emoji:"🏃",desc:"健康・安全とスポーツ",topics:["感染症と予防","医薬品・保健医療"]},
 {name:"技術",emoji:"⚙️",desc:"情報・技術とものづくり",topics:["情報モラル・知的財産権","情報セキュリティ","双方向性・計測制御"]},
 {name:"家庭",emoji:"🏠",desc:"生活・消費と自立",topics:["購入・支払い・金銭管理","消費者トラブル・権利と責任","中学生の自立・幼児の生活"]},
 {name:"美術",emoji:"🎨",desc:"美術・デザインと表現",topics:["想像の世界・作品と作家","仏像に込めた思い","近代・現代の芸術表現"]},
 {name:"音楽",emoji:"🎼",desc:"音楽の基礎・鑑賞・表現",topics:["音楽の基礎知識","楽器・音色と表現","鑑賞・音楽史"]}
];
const base=[
["保健体育","感染症と予防","飛まつ感染","人のくしゃみや咳などの飛まつによって感染すること。"],
["保健体育","感染症と予防","経口感染","病原体がついた手で触った食品を口に入れることで感染すること。"],
["保健体育","感染症と予防","空気感染","飛まつの水分が蒸発し、病原体が空気中に漂うことで感染すること。プリントでは感染力が強いと整理されている。"],
["保健体育","感染症と予防","感染症の広がりに関係する自然環境","温度・湿度。"],
["保健体育","感染症と予防","感染症の広がりに関係する社会環境","人口密度・交通・住居。"],
["保健体育","感染症と予防","性感染症とは","性的接触（臓器の粘膜、皮膚の傷口）によって感染すること。"],
["保健体育","感染症と予防","性感染症の例を3つ","性器クラミジア感染症・淋菌感染症・性器ヘルペス感染症。"],
["保健体育","感染症と予防","性感染症を放置した場合の影響","尿道・子宮・卵管などの炎症、不妊、異所性妊娠、母親から胎児への感染、流産・早産など。"],
["保健体育","感染症と予防","性感染症の予防","性的接触を避けること、コンドームを正しく使用すること。"],
["保健体育","感染症と予防","エイズの原因となる病原体","HIV（ヒト免疫不全ウイルス）。"],
["保健体育","感染症と予防","エイズとは","HIV感染によって免疫力が低下し、感染症などにかかりやすくなった状態（後天性免疫不全症候群）。"],
["保健体育","感染症と予防","HIVの感染経路としてプリントにあるもの","性的接触・母子感染・注射器具の共有。"],
["保健体育","感染症と予防","医薬品の主作用","本来の使用目的である、病気の治療や予防に効果的な作用。"],
["保健体育","感染症と予防","医薬品の副作用","目的以外の好ましくない作用。体質や病気の状態などが関係する。"],
["保健体育","医薬品・保健医療","処方薬を他人に使ったり、残った薬を使ったりしてはいけない理由","個人の状態や体重に合わせて処方されており、健康に悪影響を及ぼすおそれがあるため。"],
["保健体育","医薬品・保健医療","OTC薬とは","処方箋がなくても、ドラッグストアやコンビニなどで購入できる一般用医薬品。"],
["技術","情報モラル・知的財産権","知的財産権とは","知的な創造活動や発明などから生まれた成果を守る権利。"],
["技術","情報モラル・知的財産権","著作権が関わる著作物の例","文学・音楽・写真・絵画・映画など。"],
["技術","情報モラル・知的財産権","著作権（財産権）とは","文字や音、色などで表現した著作物を、他者に勝手に利用されないための権利。"],
["技術","情報モラル・知的財産権","著作者人格権とは","著作物の公表や著作者名の表記などを、著作者が決定する権利。"],
["技術","情報モラル・知的財産権","著作隣接権とは","放送事業者など、著作物を伝える人の権利を保護するもの。"],
["技術","情報モラル・知的財産権","特許権が保護するもの","新しい発明やアイディア。"],
["技術","情報モラル・知的財産権","実用新案権が保護するもの","物品の構造や形状に関係するアイディア。"],
["技術","情報モラル・知的財産権","意匠権が保護するもの","独自性がある物品のデザインや意匠。"],
["技術","情報モラル・知的財産権","商標権が保護するもの","商品やサービスに使用される名称やマーク。"],
["技術","情報モラル・知的財産権","引用とは","自分の意見や主張を補強するため、他人の著作物を利用すること。"],
["技術","情報セキュリティ","サイバーセキュリティとは","情報通信ネットワークへの不正侵入、データの改ざん・破壊などを防ぐ技術や政策。"],
["技術","情報セキュリティ","セキュリティ対策ソフトウェアの役割","コンピュータウイルスなどのマルウェアに感染しないように対策する。"],
["技術","情報セキュリティ","ウイルス定義ファイルを更新する理由","新しいウイルスに対応するため。"],
["技術","情報セキュリティ","ファイアウォールとは","外部との通信を一定の条件で制限し、コンピュータネットワークの安全を維持する仕組み。"],
["技術","情報セキュリティ","フィルタリングとは","危険なキーワードやアドレスなどを識別し、問題のあるメール・Webページ・プログラムなどを制限すること。"],
["技術","情報セキュリティ","フィルタリングのデメリット","入手できる情報が少なくなること。"],
["技術","情報セキュリティ","認証システムとは","ユーザIDとパスワードなどを利用し、サービスを利用する人を限定したり、データを保護したりする仕組み。"],
["技術","情報セキュリティ","生体認証とは","身体的な特徴などを利用して本人確認を行う認証技術。プリントでは認証システムと組み合わせて安全性を高めるとある。"],

["技術","双方向性・計測制御","双方向性とは","使用者の働きかけに応じて応対する機能。"],
["技術","双方向性・計測制御","コンテンツとは","文字・音声・静止画・動画などのメディアを、目的に応じて組み合わせて表現した情報。"],
["技術","双方向性・計測制御","順次処理とは","一つ一つの処理を順番に行うこと。"],
["技術","双方向性・計測制御","反復処理とは","同じ処理を何度も繰り返すこと。"],
["技術","双方向性・計測制御","変数とは","文字列や数値を出し入れする、名前をつけた箱のようなもの。"],
["技術","双方向性・計測制御","分岐処理とは","条件に応じて行われる処理。"],

function show(id){["home","detail","study"].forEach(x=>{const e=document.getElementById(x);if(e)e.classList.toggle("hidden",x!==id)})}
function goHome(){show("home");renderHome()}
function key(q){return q[0]+"|"+q[1]+"|"+q[2]}
function arg(v){return JSON.stringify(String(v)).replace(/"/g,"&quot;")}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function backToDetail(){if(currentSubject)openSubject(currentSubject);else goHome()}

/* Stable study engine + restored utilities */
function renderHome(){
 const total=document.getElementById("totalCount");if(total)total.textContent=all().length;
 const done=document.getElementById("doneCount");if(done)done.textContent=Object.keys(progress).filter(k=>progress[k]?.tries>0).length;
 const weakEl=document.getElementById("weakCount");if(weakEl)weakEl.textContent=weak.length;
 document.getElementById("subjects").innerHTML=subjects.map(s=>'<button class="subject" onclick="openSubject('+arg(s.name)+')"><div class="emoji">'+s.emoji+'</div><h3>'+s.name+'</h3><p>'+s.desc+'</p><div class="count">'+all().filter(q=>q[0]===s.name).length+' 問収録　→</div></button>').join("");
}
function openSubject(name){
 currentSubject=name;currentTopic=null;

 const mastered=items.filter(q=>progress[key(q)]?.correct>0).length;
 document.getElementById("subjectProgress").style.width=(items.length?mastered/items.length*100:0)+"%";
 const topics=[...new Set(items.map(q=>q[1]))];
 document.getElementById("topicList").innerHTML=topics.map(t=>'<button class="topic" onclick="selectTopic('+arg(t)+')"><div><b>'+escText(t)+'</b><span>'+items.filter(q=>q[1]===t).length+'問</span></div><span class="arrow">›</span></button>').join("");
 document.getElementById("topicList").classList.remove("hidden");
 document.getElementById("formatStage").classList.add("hidden");
 show("detail");
}
function selectTopic(topic){
 currentTopic=topic;document.getElementById("selectedTopicTitle").textContent=topic;
 const items=all().filter(q=>q[0]===currentSubject&&q[1]===topic);
 const modes=[
 ["mix","ランダム出題","↻","いろいろな形式を組み合わせて出題","全"+items.length+"問から出題"],
 ["quiz","4択問題","A","4つの選択肢から正しい答えを選ぶ","知識の確認におすすめ"],
 ["tf","○×問題","○","説明が正しいかどうかを判断する","短時間で反復"],
 ["fill","記述・穴埋め","✎","答えを自分で入力して確認する","表現の違いも考慮して判定"],
 ["flash","一問一答","▤","答えを見て、自分で理解を確認する","スキマ時間の復習に"],
 ["weak","苦手復習","↺","間違えた問題を中心に解き直す",weak.filter(k=>items.some(q=>key(q)===k)).length+"問"]
 ];
 document.getElementById("modeGrid").innerHTML=modes.map((m,i)=>'<button class="mode-card '+(i===0?'mode-featured':'')+'" onclick="launch('+arg(currentSubject)+','+arg(topic)+','+arg(m[0])+')"><span class="mode-icon">'+m[2]+'</span><span class="mode-copy"><b>'+m[1]+'</b><small>'+m[3]+'</small><em>'+m[4]+'</em></span><span class="mode-arrow">›</span></button>').join("");
 document.getElementById("topicList").classList.add("hidden");document.getElementById("formatStage").classList.remove("hidden");
}
function backToTopics(){document.getElementById("formatStage").classList.add("hidden");document.getElementById("topicList").classList.remove("hidden")}
function launch(sub,topic,kind){
 currentSubject=sub||currentSubject;currentTopic=topic;mode=kind;
 let items=all().filter(q=>(!sub||q[0]===sub)&&(!topic||q[1]===topic));
 if(kind==="weak")items=all().filter(q=>weak.includes(key(q))&&(!sub||q[0]===sub));
 if(!items.length){alert(kind==="weak"?"苦手登録した問題はまだありません。":"この条件の問題はまだありません。");return;}
 queue=shuffle(items);if(kind==="mix")queue=queue.slice(0,Math.min(20,queue.length));
 idx=0;show("study");renderStudy();
}
function startQuiz(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="quiz";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function startFlash(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="flash";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function startWeak(){launch("",null,"weak");}
function renderStudy(){
 const body=document.getElementById("studyBody"),tools=document.getElementById("studyTools");
 if(idx>=queue.length){
  document.getElementById("studyMode").textContent="COMPLETED";document.getElementById("studyCount").textContent=queue.length+"問 完了";
  document.getElementById("studyProgress").style.width="100%";document.getElementById("prompt").textContent="おつかれさま！";
  body.innerHTML='<div class="answer">最後まで取り組めました。<br>間違えた問題は苦手復習から解き直せます。</div>';
  tools.innerHTML='<button class="btn primary" onclick="backToDetail()">教科に戻る</button><button class="btn" onclick="goHome()">ホームへ</button>';return;
 }
 const q=queue[idx];answered=false;flashRevealed=false;
 document.getElementById("studyMode").textContent=({mix:"RANDOM MIX",quiz:"4 CHOICE",tf:"TRUE / FALSE",fill:"FILL IN",flash:"FLASH CARD",weak:"WEAK REVIEW"})[mode]||"PRACTICE";
 document.getElementById("studyCount").textContent=(idx+1)+" / "+queue.length+"　・　"+q[0]+" / "+q[1];
 document.getElementById("studyProgress").style.width=(idx/queue.length*100)+"%";
 document.getElementById("prompt").textContent=q[2];tools.innerHTML='';
 let actual=mode;if(mode==="mix"||mode==="weak")actual=shuffle(["quiz","tf","fill","flash"])[0];
 if(actual==="flash"){body.innerHTML='<div id="flashAnswer" class="answer hidden"></div><button class="btn primary" onclick="revealFlash()">答えを見る</button>';tools.insertAdjacentHTML("beforeend",'<button class="btn" onclick="next()">次の問題 →</button>');return;}
 if(actual==="quiz"){
  const distractors=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3])).slice(0,3).map(x=>x[3]);
  let opts=shuffle([q[3],...distractors]);const fillers=["該当しない","どれも正しくない","別の内容"];
  while(opts.length<4)opts.push(fillers[opts.length-1]||"該当しない");opts=opts.slice(0,4);
  window.answerOptions=opts;window.answerCorrect=q[3];
  body.innerHTML='<div class="choices">'+opts.map((o,i)=>'<button class="choice" onclick="chooseOption('+i+')">'+["A","B","C","D"][i]+'　'+escText(o)+'</button>').join("")+'</div><div id="feedback"></div>';
 }else if(actual==="tf"){
  const falseItem=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]))[0];
  window.tfCorrect=!falseItem||Math.random()<.5;
  window.tfStatement=window.tfCorrect?q[3]:falseItem[3];
  body.innerHTML='<div class="answer">次の説明は正しい？<br><b>'+escText(window.tfStatement)+'</b></div><div class="choices"><button class="choice" onclick="answerTF(true)">○ 正しい</button><button class="choice" onclick="answerTF(false)">× ちがう</button></div><div id="feedback"></div>';
 }else{
  body.innerHTML='<p class="muted">答えのキーワードを入力してください。</p><input id="fillInput" class="field" placeholder="答えを入力" autocomplete="off"><button class="btn primary" onclick="checkFill()">答え合わせ</button><div id="feedback"></div>';
  document.getElementById("fillInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkFill();});
 }
 tools.insertAdjacentHTML("beforeend",'<button class="btn" id="nextBtn" disabled onclick="next()">次の問題 →</button>');
}
function escText(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function revealFlash(){const a=document.getElementById("flashAnswer");a.textContent=queue[idx][3];a.classList.remove("hidden");flashRevealed=true;}
function recordAnswer(ok,approximate=false){
 const q=queue[idx],k=key(q),p=progress[k]||{tries:0,correct:0};p.tries++;if(ok)p.correct++;progress[k]=p;
 if(!ok&&!weak.includes(k))weak.push(k);save();
 const el=document.getElementById("feedback");if(el)el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?(approximate?'正解！（表現の違いを考慮）':'正解！'):'不正解。答えを確認しよう。')+'<br><b>正解：</b>'+escText(q[3])+'</div>';
 const n=document.getElementById("nextBtn");if(n)n.disabled=false;
}
function chooseOption(i){if(answered)return;answered=true;const ok=window.answerOptions[i]===window.answerCorrect;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(window.answerOptions[j]===window.answerCorrect)b.classList.add("correct");});if(!ok)document.querySelectorAll(".choice")[i].classList.add("wrong");recordAnswer(ok);}
function answerTF(v){if(answered)return;answered=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);recordAnswer(v===window.tfCorrect);}
function normalizeWritten(s){return String(s).toLowerCase().normalize("NFKC").replace(/[\\s　。、,.・「」『』（）()：:]/g,"").replace(/出来る/g,"できる").replace(/及び/g,"と");}
function writtenSimilarity(a,b){
 const grams=s=>{const out=[];for(let i=0;i<s.length-1;i++)out.push(s.slice(i,i+2));return new Set(out)};
 const A=grams(a),B=grams(b);if(!A.size||!B.size)return 0;
 let common=0;for(const x of A)if(B.has(x))common++;
 return {coverage:common/A.size,precision:common/B.size,dice:(2*common)/(A.size+B.size)};
}
function checkFill(){
 if(answered)return;
 const input=document.getElementById("fillInput").value.trim();
 if(!input){alert("答えを入力してください");return;}
 const expected=normalizeWritten(queue[idx][3]),given=normalizeWritten(input);
 const exact=expected===given;
 const score=writtenSimilarity(expected,given);
 const close=expected.length>=8&&given.length>=8&&score.coverage>=.78&&score.precision>=.68&&score.dice>=.74;
 const ok=exact||close;answered=true;recordAnswer(ok,close&&!exact);
}
function markWeak(){const k=key(queue[idx]);if(!weak.includes(k)){weak.push(k);save();}const b=document.querySelector("#studyTools .soft");if(b)b.textContent="✓ 苦手登録済み";}
function next(){idx++;renderStudy();}

function openCustom(){show("custom");renderCustom()}
function addCustom(){let s=document.getElementById("cSubject").value,t=document.getElementById("cTopic").value.trim(),q=document.getElementById("cQ").value.trim(),a=document.getElementById("cA").value.trim();if(!t||!q||!a){document.getElementById("customMsg").textContent="単元名・問題・答えをすべて入力してください。";return}custom.push([s,t,q,a]);save();["cTopic","cQ","cA"].forEach(id=>document.getElementById(id).value="");document.getElementById("customMsg").textContent="追加しました！";renderCustom();renderHome()}
function renderCustom(){let el=document.getElementById("customList");el.innerHTML=custom.length?custom.map((q,i)=>`<div class="topic"><div><b>${q[2]}</b><div class="muted">${q[0]} / ${q[1]}</div></div><button class="btn danger" onclick="deleteCustom(${i})">削除</button></div>`).join(""):'<div class="empty">追加した問題はまだありません。</div>'}
function deleteCustom(i){if(confirm("この問題を削除しますか？")){custom.splice(i,1);save();renderCustom();renderHome()}}
function exportData(){let data={app:"副教科 TEST LAB",version:1,custom,progress,weak};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="副教科_TEST_LAB_backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.custom)||!d.progress||!Array.isArray(d.weak))throw Error();if(!confirm("現在の学習データをバックアップ内容で置き換えますか？"))return;custom=d.custom;progress=d.progress;weak=d.weak;save();renderHome();alert("復元しました！")}catch(err){alert("読み込めませんでした。副教科 TEST LAB のバックアップJSONを選んでください。")}};r.readAsText(f);e.target.value=""}
renderHome();
</script>
</body></html>
