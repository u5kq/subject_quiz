function renderStudy(){
 const body=document.getElementById('studyBody'),tools=document.getElementById('studyTools');
 if(idx>=queue.length){
  document.getElementById('studyMode').textContent='COMPLETED';
  document.getElementById('studyCount').textContent=queue.length+'問 完了';
  document.getElementById('studyProgress').style.width='100%';
  document.getElementById('prompt').textContent='おつかれさま！';
  body.innerHTML='<p class="muted">最後まで取り組めました。苦手に登録した問題は復習できます。</p>';
  tools.innerHTML='<button class="btn primary" onclick="backToDetail()">教科に戻る</button><button class="btn" onclick="goHome()">ホームへ</button>';return;
 }
 const q=queue[idx];answered=false;flashRevealed=false;
 document.getElementById('studyMode').textContent=({mc:'4 CHOICE',tf:'TRUE / FALSE',fill:'FILL IN',short:'QUICK CHECK',flash:'FLASH CARD',mix:'RANDOM MIX'})[mode]||'PRACTICE';
 document.getElementById('studyCount').textContent=(idx+1)+' / '+queue.length+'　・　'+q[0]+' / '+q[1];
 document.getElementById('studyProgress').style.width=(idx/queue.length*100)+'%';
 document.getElementById('prompt').textContent=q[2];tools.innerHTML='<button class="btn soft" onclick="markWeak()">苦手に登録</button>';
 if(mode==='flash'||mode==='short'){
  body.innerHTML='<div id="flashAnswer" class="answer hidden"></div><button class="btn primary" onclick="revealFlash()">答えを見る</button>';
  tools.insertAdjacentHTML('beforeend','<button class="btn" onclick="next()">次へ →</button>');return;
 }
 if(mode==='mc'||mode==='mix'&&Math.random()<.5){
  const others=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]));
  const opts=shuffle([q[3],...others.slice(0,3).map(x=>x[3])]);
  while(opts.length<4)opts.push(['上記以外','該当しない','判断できない'][opts.length-1]||'別の内容');
  body.innerHTML='<div class="choices">'+opts.slice(0,4).map((o,i)=>'<button class="choice" onclick="chooseIndex(this,'+i+')">'+['A','B','C','D'][i]+'　'+escHtml(o)+'</button>').join('')+'</div><div id="feedback"></div>';
  window.currentOptions=opts.slice(0,4);window.currentCorrect=q[3];
 }else if(mode==='tf'||mode==='mix'&&Math.random()<.5){
  const falseItem=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]))[0];
  const truth=Math.random()<.5, statement=truth?q[3]:(falseItem?falseItem[3]:'該当しない内容');
  window.currentTF=truth;window.currentCorrect=q[3];
  body.innerHTML='<div class="answer">次の説明は正しい？<br><b>'+escHtml(statement)+'</b></div><div class="toolbar"><button class="btn" onclick="chooseTF(true)">○ 正しい</button><button class="btn" onclick="chooseTF(false)">× ちがう</button></div><div id="feedback"></div>';
 }else{
  body.innerHTML='<p class="muted">答えのキーワードや重要語句を入力してください。</p><input id="fillInput" class="input-answer" placeholder="答えを入力" autocomplete="off"><button class="btn primary" onclick="checkFill()">答え合わせ</button><div id="feedback"></div>';
  document.getElementById('fillInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkFill();});
 }
 tools.insertAdjacentHTML('beforeend','<button class="btn" id="nextBtn" disabled onclick="next()">次の問題 →</button>');
}
function revealFlash(){const q=queue[idx],a=document.getElementById('flashAnswer');a.textContent=q[3];a.classList.remove('hidden');flashRevealed=true;}
function feedback(ok,extra=''){
 const q=queue[idx],k=key(q),p=progress[k]||{tries:0,correct:0};p.tries++;if(ok)p.correct++;progress[k]=p;
 if(!ok&&!weak.includes(k))weak.push(k);save();
 const el=document.getElementById('feedback');if(el)el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'正解！':'もう一度確認しよう')+'<br>正解：'+escHtml(q[3])+(extra?'<br>'+escHtml(extra):'')+'</div>';
 const n=document.getElementById('nextBtn');if(n)n.disabled=false;
}
function chooseIndex(btn,i){if(answered)return;answered=true;const ok=window.currentOptions[i]===window.currentCorrect;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(window.currentOptions[j]===window.currentCorrect)b.classList.add('correct');});if(!ok)btn.classList.add('wrong');feedback(ok);}
function chooseTF(v){if(answered)return;answered=true;feedback(v===window.currentTF);}
function checkFill(){if(answered)return;const val=(document.getElementById('fillInput').value||'').replace(/[\s　。、,.]/g,'').toLowerCase();if(!val){alert('答えを入力してください');return;}answered=true;const ans=queue[idx][3].replace(/[\s　。、,.]/g,'').toLowerCase();const ok=ans.includes(val)||val.includes(ans);feedback(ok,ok?'入力内容を確認できました':'答えの要点を確認しよう');}
function markWeak(){const k=key(queue[idx]);if(!weak.includes(k)){weak.push(k);save();}alert('苦手問題に登録しました！');}
function next(){idx++;renderStudy();}
renderHome();
</script>
</body></html>
