 // and handles taps on the icon, title, description, and count inside each card.

   const target=event.target instanceof Element?event.target:null;

function socialCategoryMatches(q,category){
 const topic=String(q[1]||"");
 const prefixes={地理:["地理・"],歴史:["歴史・"],公民:["公民・"]};
 const merged={
  歴史:["第二次世界大戦と日本","戦後の日本と世界","昭和時代"],
  公民:["日本国憲法","国会・内閣・裁判所と三権分立","人権と共生社会","単語カード"]
 };
 return (prefixes[category]||[]).some(prefix=>topic.startsWith(prefix))||(merged[category]||[]).includes(topic);
}
function questionsForCurrentBranch(){

 if(currentParentSubject==="社会")return data.filter(q=>q[0]==="社会"&&socialCategoryMatches(q,currentBranch));
 if(currentParentSubject==="保健体育"){
  const healthTopics=["医薬品・保健医療","喫煙・飲酒・薬物乱用","心の健康とストレス","応急手当と安全","感染症と予防","生活習慣と健康"];
  return data.filter(q=>q[0]==="保健体育"&&(currentBranch==="保健分野"?healthTopics.includes(q[1]):!healthTopics.includes(q[1])));
 }
 return data.filter(q=>q[0]===currentSubject);
}

 activeTopicFilter=[...new Set(items.map(q=>q[1]))];
 document.getElementById("detailTitle").textContent="社会 ／ "+category;

 if(!items.length){document.getElementById("topicList").innerHTML='<p class="muted">この分野の問題はまだありません。</p>';document.getElementById("multiTopicStage").innerHTML="";document.getElementById("topicList").classList.remove("hidden");document.getElementById("topicStage").classList.remove("hidden");document.getElementById("formatStage").classList.add("hidden");return;}

function isVocabularyItem(q){
 const prompt=String(q[2]||"");
 if(q[0]==="英語")return /の意味は[？?]?$/.test(prompt);
 if(q[0]==="数学")return /とは[？?]?$/.test(prompt)||/何という？?$/.test(prompt)||/何というか[？?]?$/.test(prompt);
 return false;
}
function selectedQuestionLimit(total,selectorId="questionCountSelect"){const el=document.getElementById(selectorId);if(!el||el.value==="all")return total;const n=Math.max(1,parseInt(el.value,10)||20);return Math.min(n,total);}
function selectTopic(topic){
 currentTopic=topic;document.getElementById("selectedTopicTitle").textContent=topic;
 const items=questionsForCurrentBranch().filter(q=>q[1]===topic);
 const coreSubjects=["国語","数学","英語","理科","社会"];
 const isCore=coreSubjects.includes(currentSubject)||currentParentSubject==="社会";
 const vocabItems=items.filter(q=>isVocabularyItem(q));
 const hasVocab=(currentSubject==="数学"||currentSubject==="英語")&&vocabItems.length>0;
 const modes=hasVocab
 ? [["vocab-flash","単語・用語を覚える","▤","この単元の重要語句をカードで暗記","出題順はランダム"],["quiz","問題演習","A","この単元の問題で理解度を確認","4択で演習"]]
 : topic==="単語カード"
 ? [["flash","単語カード","▤","略称・用語を表から確認する","カードをめくって暗記"],["quiz","4択確認","A","4つの選択肢から正しい意味を選ぶ","覚えた内容をテスト"]]
 : isCore
 ? [["quiz","4択暗記","A","正しい答えを4つの選択肢から選ぶ","暗記・知識定着に集中"]]
 : [
 ["random","ランダム問題","↻","一問一答形式で問題をランダムな順番に出題","全"+items.length+"問から出題"],
 ["quiz","4択問題","A","4つの選択肢から正しい答えを選ぶ","知識の確認におすすめ"],
 ["tf","○×問題","○","説明が正しいかどうかを判断する","短時間で反復"],
 ["fill","記述・穴埋め","✎","答えを自分で入力して確認する","表現の違いも考慮して判定"],
 ["flash","一問一答","▤","答えを見て、自分で理解を確認する","スキマ時間の復習に"]
 ];
 document.getElementById("modeGrid").innerHTML=modes.map((m,i)=>'<button class="mode-card '+(i===0?'mode-featured':'')+'" onclick="launch('+arg(currentSubject)+','+arg(topic)+','+arg(m[0])+')"><span class="mode-icon">'+m[2]+'</span><span class="mode-copy"><b>'+m[1]+'</b><small>'+m[3]+'</small><em>'+m[4]+'</em></span><span class="mode-arrow">›</span></button>').join("");
 document.getElementById("topicStage").classList.add("hidden");document.getElementById("formatStage").classList.remove("hidden");
}
function backToTopics(){currentTopic="";document.getElementById("formatStage").classList.add("hidden");document.getElementById("topicStage").classList.remove("hidden");document.getElementById("topicList").classList.remove("hidden")}
function launchSelectedTopics(){const selected=[...document.querySelectorAll(".topic-pick:checked")].map(x=>x.value);if(!selected.length){alert("出題したい単元を選んでください。");return;}const items=questionsForCurrentBranch().filter(q=>selected.includes(q[1]));if(!items.length){alert("この単元には問題がありません。");return;}window.quizDistractorPool=items;const possible=items.filter(q=>getDistractors(q,3).length===3);if(!possible.length){alert("4択に必要な選択肢が不足しています。問題を追加してください。");return;}currentTopic=selected.length+"単元ミックス";mode="quiz";window.quizDistractorPool=items;queue=shuffle(possible).slice(0,selectedQuestionLimit(possible.length,"mixQuestionCountSelect"));idx=0;correctCount=0;answeredCount=0;show("study");renderStudy();}
function launch(sub,topic,kind){
 currentSubject=sub||currentSubject;currentTopic=topic;mode=kind;
 // 分野を選択している間は、その分野の問題だけを出題・選択肢候補に使う。
 let items=questionsForCurrentBranch().filter(q=>(!topic||q[1]===topic));
 if(kind==="vocab-flash")items=items.filter(q=>isVocabularyItem(q));
 if(!items.length){alert("この分野・単元には問題がありません。");return;}
 window.quizDistractorPool=items.slice();
 if(kind==="quiz"){items=items.filter(q=>getDistractors(q,3).length===3);if(!items.length){alert("この分野内で4択を作れる問題がまだありません。");return;}}
 mode=kind==="vocab-flash"?"flash":kind;
 queue=shuffle(items).slice(0,selectedQuestionLimit(items.length));idx=0;correctCount=0;answeredCount=0;show("study");renderStudy();
}
function startQuiz(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="quiz";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function startFlash(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="flash";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function renderStudy(){
 const body=document.getElementById("studyBody"),tools=document.getElementById("studyTools");
 if(idx>=queue.length){
  document.getElementById("studyMode").textContent="COMPLETED";
  const scored=["quiz","tf","fill"].includes(mode);const rate=answeredCount?Math.round(correctCount/answeredCount*100):0;
  document.getElementById("studyCount").textContent=scored?(queue.length+"問中 "+correctCount+"問正解"):(queue.length+"問 完了");
  document.getElementById("prompt").textContent="おつかれさま！";
  const recap=queue.map((q,i)=>'<li><b>'+escText(q[2])+'</b><span>'+escText(q[3])+'</span></li>').join("");
  body.innerHTML='<div class="answer">今回の学習は終了です。'+(scored?'<div class="session-score"><strong>'+correctCount+' / '+answeredCount+'問正解</strong><span>正答率 '+rate+'％</span></div>':'')+'</div><div class="recap"><h3>覚えておきたい重要ポイント</h3><ol>'+recap+'</ol></div>';
  tools.innerHTML='<button class="btn primary" onclick="backToDetail()">教科に戻る</button><button class="btn" onclick="goHome()">ホームへ</button>';return;
 }
 const q=queue[idx];answered=false;flashRevealed=false;
 document.getElementById("studyMode").textContent=({random:"RANDOM Q&A",quiz:"4 CHOICE",tf:"TRUE / FALSE",fill:"FILL IN",flash:"FLASH CARD"})[mode]||"PRACTICE";
 document.getElementById("studyCount").textContent=(idx+1)+" / "+queue.length+"　・　"+q[0]+" / "+q[1];
 const englishWord=englishCardWord(q);
 document.getElementById("prompt").textContent=mode==="flash-ja-en"?q[3]:(mode==="flash-en-ja"?englishWord:q[2]);tools.innerHTML='';
 let actual=mode;if(mode==="random"||mode==="flash-en-ja"||mode==="flash-ja-en")actual="flash";
 if(actual==="flash"){body.innerHTML='<div id="flashAnswer" class="answer hidden"></div><button class="btn primary" id="revealFlashBtn" onclick="revealFlash()">答えを見る</button>';tools.insertAdjacentHTML("beforeend",'<button class="btn" id="flashNextBtn" disabled onclick="next()">次の問題 →</button>');return;}
 if(actual==="quiz"){
  const distractors=getDistractors(q,3);
  const opts=shuffle([q[3],...distractors]);
  window.answerOptions=opts;window.answerCorrect=q[3];
  body.innerHTML='<div class="choices">'+opts.map((o,i)=>'<button class="choice" onclick="chooseOption('+i+')"><span class="choice-letter">'+["A","B","C","D"][i]+'</span><span class="choice-text">'+escText(o)+'</span></button>').join("")+'</div><div id="feedback"></div>';
  if(opts.length<4)body.insertAdjacentHTML("afterbegin",'<p class="muted option-note">この単元の問題数に合わせて選択肢を調整しています。</p>');
 }else if(actual==="tf"){
  const falseItem=getDistractors(q,1)[0];
  window.tfCorrect=!falseItem||Math.random()<.5;
  window.tfStatement=window.tfCorrect?q[3]:falseItem[3];
  body.innerHTML='<div class="answer">次の説明は正しい？<br><b>'+escText(window.tfStatement)+'</b></div><div class="choices"><button class="choice" onclick="answerTF(true)">○ 正しい</button><button class="choice" onclick="answerTF(false)">× ちがう</button></div><div id="feedback"></div>';
 }else{
  body.innerHTML='<p class="muted">答えのキーワードを入力してください。</p><input id="fillInput" class="field" placeholder="答えを入力" autocomplete="off"><button class="btn primary" onclick="checkFill()">答え合わせ</button><div id="feedback"></div>';
  document.getElementById("fillInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkFill();});
 }
 tools.insertAdjacentHTML("beforeend",'<button class="btn" id="nextBtn" disabled onclick="next()">次の問題 →</button>');
}
function answerSimilarity(a,b){
 const norm=x=>String(x).normalize("NFKC").toLowerCase().replace(/[\s、。，．・「」『』（）()【】［］:：;；!?！？]/g,"");
 const x=norm(a),y=norm(b);if(!x||!y)return 0;
 const short=x.length<y.length?x:y,long=x.length<y.length?y:x;
 if(long.includes(short))return short.length/long.length;
 const set=new Set([...x]);let same=0;for(const c of new Set([...y]))if(set.has(c))same++;
 return same/Math.max(x.length,y.length);
}
function quizQuestionKind(q){
 const p=String(q[2]||"");
 if(/何年|何月|年月日|いつ|年代|年号/.test(p))return "date";
 if(/誰|だれ|人物|作者|作曲者/.test(p))return "person";
 if(/どこ|場所|所在地/.test(p))return "place";
 if(/何％|何割|何分の|何倍|何個|何人|何問|何点/.test(p))return "number";
 if(/意味|どういう意味|何を表す/.test(p))return "meaning";
 if(/特徴|どのような|どのように|役割|働き|目的|方法|仕組み|理由|なぜ/.test(p))return "explanation";
 if(/何という|何と|名称|何の名前|何と呼ぶ/.test(p))return "term";
 if(/正しい|適切|当てはまる|選び/.test(p))return "selection";
 return "general";
}
function quizAnswerKind(q){
 const a=String(q[3]||"").trim();
 if(/^\\d{4}年?([0-9月日年月]*)$/.test(a)||/^\\d{4}年\\d{1,2}月\\d{1,2}日$/.test(a))return "date";
 if(/^\\d+(％|%|割|分の|倍|個|人|回|点|時間|分|円|ドル)/.test(a))return "number";
 if(/^[A-Za-z][A-Za-z -]*$/.test(a))return a.includes(" ")?"english_phrase":"english_word";
 if(a.length<=8&&!/[。、「」]/.test(a))return "short_term";
 if(a.length>=18)return "definition";
 return "phrase";
}
function getDistractors(q,count){
 if(Array.isArray(q[4])){const supplied=Array.isArray(q[4][0])?q[4][0]:q[4];return shuffle(supplied.filter(x=>typeof x==="string")).filter(x=>String(x).trim()!==String(q[3]).trim()).slice(0,count);}
 const source=Array.isArray(window.quizDistractorPool)?window.quizDistractorPool:all();
 const kind=quizQuestionKind(q),answerKind=quizAnswerKind(q);
 const pool=source.filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]&&quizQuestionKind(x)===kind&&quizAnswerKind(x)===answerKind);
 const unique=[],seen=new Set([String(q[3]).normalize("NFKC").replace(/\s/g,"")]);
 for(const x of pool){const a=String(x[3]).trim(),k=a.normalize("NFKC").replace(/\s/g,"");if(!a||seen.has(k))continue;seen.add(k);unique.push(x);}
 const sameTopic=shuffle(unique.filter(x=>x[1]===q[1]));
 const otherTopics=shuffle(unique.filter(x=>x[1]!==q[1]));
 const sortByLength=arr=>arr.sort((a,b)=>Math.abs(String(a[3]).length-String(q[3]).length)-Math.abs(String(b[3]).length-String(q[3]).length));
 let selected=sortByLength(sameTopic).slice(0,count);
 if(selected.length<count)selected=selected.concat(sortByLength(otherTopics).slice(0,count-selected.length));
 return selected.length===count?selected.map(x=>x[3]):[];
}
function escText(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function englishCardWord(q){
 const prompt=String(q[2]||"").trim();
 const match=prompt.match(/^(.+?)\s*の意味は[？?]?$/);
 if(match)return match[1].trim();
 if(/^[A-Za-z][A-Za-z -]*$/.test(prompt))return prompt;
 return prompt;
}
function revealFlash(){
 const q=queue[idx],a=document.getElementById("flashAnswer");
 const answer=mode==="flash-ja-en"?englishCardWord(q):q[3];
 a.innerHTML='<b>答え</b><br>'+escText(answer)+'<div class="feedback"><b>ポイント</b><br>'+escText(buildQuestionExplanation(q))+'</div>';
 a.classList.remove("hidden");flashRevealed=true;
 const reveal=document.getElementById("revealFlashBtn");if(reveal)reveal.disabled=true;
 const nextButton=document.getElementById("flashNextBtn");if(nextButton)nextButton.disabled=false;
}
function buildQuestionExplanation(q){
 if(typeof q[5]==="string"&&q[5].trim())return q[5].trim();
 const subject=String(q[0]||"");
 const topic=String(q[1]||"この単元");
 const question=String(q[2]||"").trim();
 const answer=String(q[3]||"").trim();
 const term=question.replace(/[？?。]+$/,"").replace(/とは$/,"").trim();
 const vocab=question.match(/^(.+?)\s*の意味は[？?]?$/);
 if(vocab)return "「"+vocab[1].trim()+"」は「"+answer+"」という意味です。英語のつづりと日本語の意味をセットで覚えましょう。";
 if(/とは$/.test(question)||question===term){
  return "「"+term+"」とは、"+answer.replace(/[。]+$/,"")+"のことです。用語とその定義を結び付けて覚えましょう。";
 }
 if(answer.length>=18){
  return answer.replace(/[。．]$/,"")+"。この説明に含まれる重要な語句や、何のために使うのかに注目すると、正解の理由を理解しやすくなります。";
 }
 if(question.length<=18&&answer.length>=8){
  return "「"+question.replace(/[？?。]+$/,"")+"」は、"+answer.replace(/[。．]$/,"")+"という意味です。用語と内容をセットで覚えましょう。";
 }
 const focus=subject==="保健体育"?"体の働きや安全・健康との関係":subject==="技術"?"技術の仕組みと目的":subject==="家庭"?"生活の中での役割や選び方":subject==="美術"?"表現の特徴や用具・技法":subject==="音楽"?"音の特徴や表現方法":"この単元の重要語句";
 return "ポイント：「"+topic+"」では、"+focus+"を理解することが大切です。正解の「"+answer+"」が問題文の問いにどう対応するかを確認しましょう。";
}
function recordAnswer(ok,approximate=false){
 const q=queue[idx];answeredCount++;if(ok)correctCount++;
 const counter=document.getElementById("studyCount");if(counter)counter.textContent=(idx+1)+" / "+queue.length+"　・　正解 "+correctCount+" / "+answeredCount;
 const el=document.getElementById("feedback");
 if(el){
  const explanation='<div class="feedback"><b>かんたん解説</b><br>'+escText(buildQuestionExplanation(q))+'</div>';
  el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?(approximate?'正解！（表現の違いを考慮）':'正解！'):'不正解。答えを確認しよう。')+'<br><b>正解：</b>'+escText(q[3])+'</div>'+explanation;
 }
 const n=document.getElementById("nextBtn");if(n)n.disabled=false;
}
function chooseOption(i){if(answered)return;answered=true;const ok=window.answerOptions[i]===window.answerCorrect;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(window.answerOptions[j]===window.answerCorrect)b.classList.add("correct");});if(!ok)document.querySelectorAll(".choice")[i].classList.add("wrong");recordAnswer(ok);}
function answerTF(v){if(answered)return;answered=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);recordAnswer(v===window.tfCorrect);}
function normalizeWritten(s){return String(s).toLowerCase().normalize("NFKC").replace(/[\s　。、,.・「」『』（）()：:]/g,"").replace(/出来る/g,"できる").replace(/及び/g,"と");}
function writtenSimilarity(a,b){
 const grams=s=>{const out=[];for(let i=0;i<s.length-1;i++)out.push(s.slice(i,i+2));return new Set(out)};
 const A=grams(a),B=grams(b);if(!A.size||!B.size)return 0;
 let common=0;for(const x of A)if(B.has(x))common++;
 return {coverage:common/A.size,precision:common/B.size,dice:(2*common)/(A.size+B.size)};
}
function checkFill(){
 if(answered)return;
 const input=document.getElementById("fillInput").value.trim();
 if(!input){alert("答えを入力してください");return;}
 const expected=normalizeWritten(queue[idx][3]),given=normalizeWritten(input);
 const exact=expected===given;
 const score=writtenSimilarity(expected,given);
 const close=expected.length>=8&&given.length>=8&&score.coverage>=.78&&score.precision>=.68&&score.dice>=.74;
 const ok=exact||close;answered=true;recordAnswer(ok,close&&!exact);
}
