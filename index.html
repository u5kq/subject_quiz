<html lang="ja">
<head>

<title>副教科 STUDY</title>
<style>

:root{--bg:#f5f6f8;--paper:#fff;--ink:#20242b;--muted:#77808c;--line:#e4e7ec;--accent:#e0ad16;--accent-dark:#8b6700;--soft:#fff5d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.6}button,input{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:0 20px 48px}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 900px)/2));position:sticky;top:0;z-index:5;margin:0 calc((900px - 100vw)/2)}
.brand{font-weight:900;letter-spacing:.07em;font-size:15px}.brand-mark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--accent);color:#302600;margin-right:8px;font-size:15px}.header-note{font-size:12px;color:var(--muted)}
main{padding-top:32px}.hero{padding-bottom:10px}.eyebrow,.card-label{font-size:10px;font-weight:850;letter-spacing:.16em;color:var(--accent-dark)}h1{font-size:clamp(26px,5vw,35px);line-height:1.3;margin:8px 0}.hero p,.muted{font-size:13px;color:var(--muted)}
.stats,.actions{display:none!important}.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}.section-head h2{font-size:17px;margin:0}.section-head small{font-size:10px;color:var(--muted);letter-spacing:.14em}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;text-align:left;min-height:122px;transition:.16s;color:var(--ink)}.subject:hover{border-color:#e4c45f;transform:translateY(-2px);box-shadow:0 8px 22px #2221}.subject:active,.btn:active,.topic:active{transform:scale(.985)}
.subject .emoji{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:20px}.subject h3{font-size:15px;margin:10px 0 3px}.subject p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.subject .count{font-size:10px;color:var(--accent-dark);font-weight:800;margin-top:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;margin-top:14px}.hidden{display:none!important}.back{border:0;background:none;color:var(--accent-dark);font-weight:750;padding:0;margin:0 0 15px}#detailTitle{font-size:24px;margin:4px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;min-height:43px;font-size:13px;font-weight:750}.btn.primary{background:var(--accent);border-color:var(--accent);color:#302600}.btn.soft{background:var(--soft);border-color:#f1dfaa;color:#795900}
.topic-list{display:grid;gap:9px;margin-top:14px}.topic{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}.topic b{font-size:13px}.topic span{font-size:11px;color:var(--muted);white-space:nowrap}
.progress{height:6px;background:#edf0f4;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:var(--accent);width:0}.question{font-size:clamp(20px,4vw,26px);font-weight:780;line-height:1.5;margin:17px 0;overflow-wrap:anywhere}.answer{background:var(--soft);border:1px solid #f1dfaa;border-radius:12px;padding:15px;margin:13px 0;white-space:pre-wrap;line-height:1.8}
.choice{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px;margin:5px 0;text-align:left;min-height:50px;font-size:14px}.choice:hover{border-color:#e4c45f;background:#fffdf7}.choice:disabled{cursor:default}.choice.correct{background:#effaf5;border-color:#79c5a5}.choice.wrong{background:#fff2f2;border-color:#e7a0a0}.feedback{padding:12px;border-radius:10px;margin-top:11px;font-size:13px}.feedback.good{background:#effaf5;color:#116b49}.feedback.bad{background:#fff2f2;color:#a63737}
button:focus-visible{outline:3px solid #e4bd43;outline-offset:3px}
@media(min-width:700px){.subjects{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:560px){.app{padding:0 16px 38px}header{padding:0 16px;margin:0 -16px}main{padding-top:25px}.panel{padding:15px}.subject{padding:14px;min-height:116px}}


/* Refined yellow visual system */
:root{--accent:#e8b91e;--accent-dark:#795900;--soft:#fff6d8;--bg:#f6f6f4;--line:#e7e7e7}
header{background:#fffdf6}.brand-mark{background:var(--accent)}
.hero{background:linear-gradient(135deg,#fff8df,#fff1bd);border:1px solid #f0dfa8;border-radius:20px;padding:22px;margin-bottom:18px}
.hero p{line-height:1.8}.stats{display:none!important}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}
.stat strong{display:block;font-size:21px;color:var(--accent-dark)}.stat span{font-size:10px;color:var(--muted)}
.home-tools{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.file-label{display:inline-flex;align-items:center;cursor:pointer}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}
.mode-card{min-height:66px;text-align:left}.mode-card b{display:block}.mode-card small{display:block;font-weight:500;font-size:10px;opacity:.75;margin-top:3px}
.topic-actions{display:flex;gap:6px;flex-shrink:0}.topic-actions .btn{padding:8px 10px;min-height:37px;font-size:11px}
.field{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin:5px 0 13px;background:#fff;font:inherit}
label.muted{display:block;margin-top:7px}
.choices{display:grid;gap:9px}.choice{margin:0;min-height:54px;border-radius:13px;line-height:1.55}
.answer{font-size:15px}.panel{border-radius:18px}
@media(min-width:700px){.mode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){.home-tools .btn,.file-label{flex:1;justify-content:center;font-size:11px;padding:9px 7px}.topic{align-items:flex-start}.topic-actions{width:100%}.topic-actions .btn{flex:1}.stats{gap:6px}.stat{padding:9px 5px}}

</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="brand-mark">Q</span>副教科 QUIZ</div><div class="header-note">いつでも使える学習ツール</div></header>
<main id="home">
<section class="hero"><div class="eyebrow">STUDY / PRACTICE / REVIEW</div><h1>わかるまで、何度でも。</h1><p>教科・単元を選んで、問題形式を変えながら学習。定期テストにも日々の復習にも使えます。</p></section>
<div class="section-head"><h2>教科から学習する</h2><small>SUBJECTS</small></div>
<div class="subjects" id="subjects"></div><div class="toolbar" style="margin-top:16px"><button class="btn soft" onclick="startWeak()">☆ 苦手を復習</button><button class="btn" onclick="openCustom()">問題を追加・管理</button><button class="btn" onclick="exportData()">保存</button><label class="btn file-label">復元<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div>
</main>
<section id="detail" class="hidden"><button class="back" onclick="goHome()">← ホームに戻る</button><div class="panel"><div class="card-label">SUBJECT</div><h2 id="detailTitle"></h2><p class="muted" id="detailDesc"></p><div class="progress"><i id="subjectProgress"></i></div><div class="mode-grid" id="modeGrid"></div><div class="section-head"><h3>単元から選ぶ</h3><small>TOPICS</small></div><div class="topic-list" id="topicList"></div></div></section>
<section id="study" class="hidden"><button class="back" onclick="backToDetail()">← 戻る</button><div class="panel"><div class="card-label" id="studyMode">PRACTICE</div><div class="muted" id="studyCount"></div><div class="progress"><i id="studyProgress"></i></div><div class="question" id="prompt"></div><div id="studyBody"></div><div class="toolbar" id="studyTools"></div></div></section>
<section id="custom" class="hidden"><button class="back" onclick="goHome()">← ホームに戻る</button><div class="panel"><div class="card-label">CUSTOM CONTENT</div><h2>自分の問題を追加</h2><p class="muted">授業で強調された内容や、プリントの空欄を登録しよう。追加した内容も単語帳・4択に反映されます。</p><label class="muted">教科</label><select id="cSubject" class="field"><option>保健体育</option><option>技術</option><option>家庭</option><option>美術</option><option>音楽</option></select><label class="muted">単元名</label><input id="cTopic" class="field" placeholder="例：情報セキュリティ"><label class="muted">問題・用語</label><input id="cQ" class="field" placeholder="例：情報セキュリティの三要素は？"><label class="muted">答え</label><input id="cA" class="field" placeholder="例：機密性・完全性・可用性"><button class="btn primary" onclick="addCustom()">この問題を追加</button><div id="customMsg" class="muted"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3 style="font-size:14px">自分で追加した問題</h3><div id="customList"></div></div></section>
<footer>STUDY TOOL · 学習データはこの端末のブラウザ内に保存されます</footer>
</div>

let custom=JSON.parse(localStorage.getItem("副教科_custom")||"[]");
let progress=JSON.parse(localStorage.getItem("副教科_progress")||"{}");
let weak=JSON.parse(localStorage.getItem("副教科_weak")||"[]");
let currentSubject="",currentTopic="",queue=[],idx=0,mode="",answered=false,flashRevealed=false;
const all=()=>base.concat(custom);
function save(){localStorage.setItem("副教科_custom",JSON.stringify(custom));localStorage.setItem("副教科_progress",JSON.stringify(progress));localStorage.setItem("副教科_weak",JSON.stringify(weak))}
function show(id){["home","detail","study","custom"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function goHome(){show("home");renderHome()}
function key(q){return q[0]+"|"+q[1]+"|"+q[2]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function backToDetail(){if(currentSubject)openSubject(currentSubject);else goHome()}

/* Stable study engine + restored utilities */
function renderHome(){
 document.getElementById("totalCount").textContent=all().length;
 document.getElementById("doneCount").textContent=Object.keys(progress).filter(k=>progress[k]?.tries>0).length;
 document.getElementById("weakCount").textContent=weak.length;
 document.getElementById("subjects").innerHTML=subjects.map(s=>'<button class="subject" onclick="openSubject('+JSON.stringify(s.name)+')"><div class="emoji">'+s.emoji+'</div><h3>'+s.name+'</h3><p>'+s.desc+'</p><div class="count">'+all().filter(q=>q[0]===s.name).length+' 問収録　→</div></button>').join("");
}
function openSubject(name){
 currentSubject=name;currentTopic=null;
 const s=subjects.find(x=>x.name===name),items=all().filter(q=>q[0]===name);
 document.getElementById("detailTitle").textContent=name;
 document.getElementById("detailDesc").textContent=s.desc+" ／ "+items.length+"問";
 const mastered=items.filter(q=>progress[key(q)]?.correct>0).length;
 document.getElementById("subjectProgress").style.width=(items.length?mastered/items.length*100:0)+"%";
 const modes=[["mix","ランダム総合","4形式を混ぜて出題",true],["quiz","4択問題","選択肢から選ぶ"],["tf","○×問題","正しいか判定"],["fill","穴埋め問題","答えを入力"],["flash","一問一答","答えを見て確認"],["weak","苦手を復習","登録した問題を解き直す"]];
 document.getElementById("modeGrid").innerHTML=modes.map((m,i)=>'<button class="btn mode-card '+(i===0?'primary':'')+'" onclick="launch('+JSON.stringify(name)+',null,'+JSON.stringify(m[0])+')"><b>'+m[1]+'</b><small>'+m[2]+'</small></button>').join("");
 const topics=[...new Set(s.topics.concat(custom.filter(q=>q[0]===name).map(q=>q[1])))];
 document.getElementById("topicList").innerHTML=topics.map(t=>{const n=items.filter(q=>q[1]===t).length;return '<div class="topic"><div><b>'+t+'</b><span style="display:block">'+n+'問</span></div><div class="topic-actions"><button class="btn soft" onclick="launch('+JSON.stringify(name)+','+JSON.stringify(t)+',\'flash\')">一問一答</button><button class="btn primary" onclick="launch('+JSON.stringify(name)+','+JSON.stringify(t)+',\'mix\')">出題する →</button></div></div>';}).join("");
 show("detail");
}
function launch(sub,topic,kind){
 currentSubject=sub||currentSubject;currentTopic=topic;mode=kind;
 let items=all().filter(q=>(!sub||q[0]===sub)&&(!topic||q[1]===topic));
 if(kind==="weak")items=all().filter(q=>weak.includes(key(q))&&(!sub||q[0]===sub));
 if(!items.length){alert(kind==="weak"?"苦手登録した問題はまだありません。":"この条件の問題はまだありません。");return;}
 queue=shuffle(items);if(kind==="mix")queue=queue.slice(0,Math.min(20,queue.length));
 idx=0;show("study");renderStudy();
}
function startQuiz(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="quiz";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function startFlash(sub,topic=null,items=null){currentSubject=sub||currentSubject;currentTopic=topic;mode="flash";queue=shuffle(items||all().filter(q=>q[0]===sub&&(!topic||q[1]===topic)));idx=0;if(!queue.length){alert("問題がありません");return;}show("study");renderStudy();}
function startWeak(){launch("",null,"weak");}
function renderStudy(){
 const body=document.getElementById("studyBody"),tools=document.getElementById("studyTools");
 if(idx>=queue.length){
  document.getElementById("studyMode").textContent="COMPLETED";document.getElementById("studyCount").textContent=queue.length+"問 完了";
  document.getElementById("studyProgress").style.width="100%";document.getElementById("prompt").textContent="おつかれさま！";
  body.innerHTML='<div class="answer">最後まで取り組めました。<br>間違えた問題は苦手復習から解き直せます。</div>';
  tools.innerHTML='<button class="btn primary" onclick="backToDetail()">教科に戻る</button><button class="btn" onclick="goHome()">ホームへ</button>';return;
 }
 const q=queue[idx];answered=false;flashRevealed=false;
 document.getElementById("studyMode").textContent=({mix:"RANDOM MIX",quiz:"4 CHOICE",tf:"TRUE / FALSE",fill:"FILL IN",flash:"FLASH CARD",weak:"WEAK REVIEW"})[mode]||"PRACTICE";
 document.getElementById("studyCount").textContent=(idx+1)+" / "+queue.length+"　・　"+q[0]+" / "+q[1];
 document.getElementById("studyProgress").style.width=(idx/queue.length*100)+"%";
 document.getElementById("prompt").textContent=q[2];tools.innerHTML='<button class="btn soft" onclick="markWeak()">☆ 苦手に登録</button>';
 let actual=mode;if(mode==="mix"||mode==="weak")actual=shuffle(["quiz","tf","fill","flash"])[0];
 if(actual==="flash"){body.innerHTML='<div id="flashAnswer" class="answer hidden"></div><button class="btn primary" onclick="revealFlash()">答えを見る</button>';tools.insertAdjacentHTML("beforeend",'<button class="btn" onclick="next()">次の問題 →</button>');return;}
 if(actual==="quiz"){
  const distractors=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3])).slice(0,3).map(x=>x[3]);
  let opts=shuffle([q[3],...distractors]);const fillers=["該当しない","どれも正しくない","別の内容"];
  while(opts.length<4)opts.push(fillers[opts.length-1]||"該当しない");opts=opts.slice(0,4);
  window.answerOptions=opts;window.answerCorrect=q[3];
  body.innerHTML='<div class="choices">'+opts.map((o,i)=>'<button class="choice" onclick="chooseOption('+i+')">'+["A","B","C","D"][i]+'　'+escText(o)+'</button>').join("")+'</div><div id="feedback"></div>';
 }else if(actual==="tf"){
  const falseItem=shuffle(all().filter(x=>x[0]===q[0]&&x[2]!==q[2]&&x[3]!==q[3]))[0];
  window.tfCorrect=!falseItem||Math.random()<.5;
  window.tfStatement=window.tfCorrect?q[3]:falseItem[3];
  body.innerHTML='<div class="answer">次の説明は正しい？<br><b>'+escText(window.tfStatement)+'</b></div><div class="choices"><button class="choice" onclick="answerTF(true)">○ 正しい</button><button class="choice" onclick="answerTF(false)">× ちがう</button></div><div id="feedback"></div>';
 }else{
  body.innerHTML='<p class="muted">答えのキーワードを入力してください。</p><input id="fillInput" class="field" placeholder="答えを入力" autocomplete="off"><button class="btn primary" onclick="checkFill()">答え合わせ</button><div id="feedback"></div>';
  document.getElementById("fillInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkFill();});
 }
 tools.insertAdjacentHTML("beforeend",'<button class="btn" id="nextBtn" disabled onclick="next()">次の問題 →</button>');
}
function escText(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function revealFlash(){const a=document.getElementById("flashAnswer");a.textContent=queue[idx][3];a.classList.remove("hidden");flashRevealed=true;}
function recordAnswer(ok){
 const q=queue[idx],k=key(q),p=progress[k]||{tries:0,correct:0};p.tries++;if(ok)p.correct++;progress[k]=p;
 if(!ok&&!weak.includes(k))weak.push(k);save();
 const el=document.getElementById("feedback");if(el)el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'正解！':'不正解。答えを確認しよう。')+'<br><b>正解：</b>'+escText(q[3])+'</div>';
 const n=document.getElementById("nextBtn");if(n)n.disabled=false;
}
function chooseOption(i){if(answered)return;answered=true;const ok=window.answerOptions[i]===window.answerCorrect;document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(window.answerOptions[j]===window.answerCorrect)b.classList.add("correct");});if(!ok)document.querySelectorAll(".choice")[i].classList.add("wrong");recordAnswer(ok);}
function answerTF(v){if(answered)return;answered=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);recordAnswer(v===window.tfCorrect);}
function checkFill(){if(answered)return;const input=document.getElementById("fillInput").value.trim();if(!input){alert("答えを入力してください");return;}answered=true;const norm=s=>s.toLowerCase().replace(/[\s　。、,.・]/g,"");const a=norm(queue[idx][3]),v=norm(input);const ok=a.includes(v)||v.includes(a);recordAnswer(ok);}
function markWeak(){const k=key(queue[idx]);if(!weak.includes(k)){weak.push(k);save();}const b=document.querySelector("#studyTools .soft");if(b)b.textContent="✓ 苦手登録済み";}
function next(){idx++;renderStudy();}

function openCustom(){show("custom");renderCustom()}
function addCustom(){let s=document.getElementById("cSubject").value,t=document.getElementById("cTopic").value.trim(),q=document.getElementById("cQ").value.trim(),a=document.getElementById("cA").value.trim();if(!t||!q||!a){document.getElementById("customMsg").textContent="単元名・問題・答えをすべて入力してください。";return}custom.push([s,t,q,a]);save();["cTopic","cQ","cA"].forEach(id=>document.getElementById(id).value="");document.getElementById("customMsg").textContent="追加しました！";renderCustom();renderHome()}
function renderCustom(){let el=document.getElementById("customList");el.innerHTML=custom.length?custom.map((q,i)=>`<div class="topic"><div><b>${q[2]}</b><div class="muted">${q[0]} / ${q[1]}</div></div><button class="btn danger" onclick="deleteCustom(${i})">削除</button></div>`).join(""):'<div class="empty">追加した問題はまだありません。</div>'}
function deleteCustom(i){if(confirm("この問題を削除しますか？")){custom.splice(i,1);save();renderCustom();renderHome()}}
function exportData(){let data={app:"副教科 TEST LAB",version:1,custom,progress,weak};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="副教科_TEST_LAB_backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.custom)||!d.progress||!Array.isArray(d.weak))throw Error();if(!confirm("現在の学習データをバックアップ内容で置き換えますか？"))return;custom=d.custom;progress=d.progress;weak=d.weak;save();renderHome();alert("復元しました！")}catch(err){alert("読み込めませんでした。副教科 TEST LAB のバックアップJSONを選んでください。")}};r.readAsText(f);e.target.value=""}
renderHome();
